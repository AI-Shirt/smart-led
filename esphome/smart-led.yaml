# smart-led: a 12x10 WS2812 panel exposed to Home Assistant as one light.
# Each channel is an effect; pick it from the light's effect list in Home Assistant.
#
# Coordinates work like a computer display: (0,0) is the top-left pixel.
# Run the "Test Pattern" effect after flashing to check the wiring settings:
#   red    = (0,0), top-left
#   green  = top row
#   blue   = left column
#   white  = bottom-right
# If the blue column or green row is broken up, flip `serpentine`.

substitutions:
  name: smart-led
  friendly_name: Smart LED
  data_pin: GPIO4
  chipset: WS2812
  rgb_order: GRB
  width: "12"
  height: "10"
  num_leds: "120"        # width x height
  serpentine: "true"     # true: odd columns run bottom to top

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - smart_led.h

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret smart_led_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback

captive_portal:

light:
  - platform: esp32_rmt_led_strip
    id: panel
    name: ${friendly_name}
    pin: ${data_pin}
    num_leds: ${num_leds}
    chipset: ${chipset}
    rgb_order: ${rgb_order}
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: Test Pattern
          update_interval: 500ms
          lambda: |-
            const int W = ${width}, H = ${height};
            const bool S = ${serpentine};
            it.all() = Color::BLACK;
            for (int x = 0; x < W; x++) smart_led::set(it, x, 0, W, H, S, Color(0, 255, 0));
            for (int y = 0; y < H; y++) smart_led::set(it, 0, y, W, H, S, Color(0, 0, 255));
            smart_led::set(it, 0, 0, W, H, S, Color(255, 0, 0));
            smart_led::set(it, W - 1, H - 1, W, H, S, Color(255, 255, 255));

      - addressable_rainbow:
          name: Rainbow
          speed: 10
          width: 50

      - addressable_lambda:
          name: Plasma
          update_interval: 33ms
          lambda: |-
            const int W = ${width}, H = ${height};
            const bool S = ${serpentine};
            static float t = 0;
            t += 0.08f;
            for (int x = 0; x < W; x++) {
              for (int y = 0; y < H; y++) {
                float v = sinf(x * 0.5f + t) + sinf(y * 0.6f - t * 1.3f) + sinf((x + y) * 0.35f + t * 0.7f);
                uint8_t hue = (uint8_t) ((v + 3.0f) * 42.5f);
                smart_led::set(it, x, y, W, H, S, smart_led::hsv(hue, 255, 255));
              }
            }

      - addressable_lambda:
          name: Rain
          update_interval: 80ms
          lambda: |-
            const int W = ${width}, H = ${height};
            const bool S = ${serpentine};
            static int head[${width}];
            if (initial_run) {
              it.all() = Color::BLACK;
              for (int x = 0; x < W; x++) head[x] = -(int) (random_uint32() % (2 * H));
            }
            it.all().fade_to_black(70);
            for (int x = 0; x < W; x++) {
              head[x]++;
              smart_led::set(it, x, head[x], W, H, S, Color(180, 255, 180));
              if (head[x] > H + (int) (random_uint32() % H)) head[x] = -(int) (random_uint32() % H);
            }

      - addressable_twinkle:
          name: Twinkle
          twinkle_probability: 8%
          progress_interval: 20ms

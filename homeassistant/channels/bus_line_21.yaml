# smart-led channel: bus line 21 countdown (needs the Smart LED integration)
#
# Top line:    C : minutes to the next bus to Centraal
# Bottom line: L : minutes to the next bus to Lohmanstraat
# Minutes: red <= 2, orange <= 5, green otherwise. "+" above 9 minutes, "-" when no bus is known.
#
# Script: Settings > Automations & Scenes > Scripts > Add > Edit in YAML.
# Keep the script's entity id script.smart_led_bus_line_21 so the automation below finds it.

# ---------- script ----------
alias: "smart-led: bus line 21"
description: Draw the bus line 21 countdown on the Smart LED display.
mode: restart
sequence:
  - variables:
      lines:
        top: { letter: "C", minutes: "{{ states('sensor.bus_line_21_next_to_centraal') }}" }
        bottom: { letter: "L", minutes: "{{ states('sensor.bus_line_21_to_lohmanstraat') }}" }
  - repeat:
      for_each: [top, bottom]
      sequence:
        - variables:
            m: "{{ lines[repeat.item].minutes | int(-1) }}"
        - action: smart_led.show_text
          data:
            line: "{{ repeat.item }}"
            left: "{{ lines[repeat.item].letter }}"
            separator: ":"
            right: "{{ '-' if m < 0 else ('+' if m > 9 else m | string) }}"
            color: white
            right_color: "{{ 'grey' if m < 0 else ('red' if m <= 2 else ('orange' if m <= 5 else 'green')) }}"

